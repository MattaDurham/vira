<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="dark light">
  <title>Your assistant - Vira</title>
  <link rel="stylesheet" href="/assistant-page.css">
  <link rel="stylesheet" href="/assistant.css">
  <script src="/assistant-page.js" defer></script>
  <script src="/assistant.js" defer></script>
</head>
<body>
  <header class="assistant-page-header">
    <a class="assistant-brand" href="/">VIRA</a>
    <a href="/#brief">Open Attention</a>

  <main id="attention-day-pane">
    <div class="assistant-page-intro">
      <p class="assistant-page-eyebrow">Your assistant</p>
      <h1>Keep the important things moving.</h1>
